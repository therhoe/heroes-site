<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work with us — The Real Heroes of Ecommerce</title>
  <meta name="description" content="Work with The Real Heroes of Ecommerce. Tell us what you are working on and what you need help with, and we will get back to you.">
  <link rel="canonical" href="https://therealheroesofecommerce.com/hire-cro-agency.html">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ====================================================================
       CRO service. Same shell as index.html and /newsletter/ -- wide
       canvas, sticky header with the CTA pill, big hero. Stripped back to
       one job: say what this is and take the enquiry.
       ==================================================================== */
    :root {
      --fg: #14171a;
      --muted: #5c6166;
      --line: #e2e2e2;
      --accent: #ffc42a;
      --maxw: 1200px;
      --gutter: 24px;
      --control-height: 48px;
      --radius: 16px;
      --shadow: 0 2px 4px rgba(0, 0, 0, 0.04), 0 14px 32px rgba(0, 0, 0, 0.09);
      --font: "Space Grotesk", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: var(--fg);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    p { margin: 0 0 16px; }
    ul { list-style: none; margin: 0; padding: 0; }
    a { color: inherit; }
    .wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }

    /* --- header --- */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: saturate(180%) blur(12px);
    }
    .site-header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-block: 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand img { display: block; width: 240px; max-width: 46vw; height: auto; }
    .site-nav { display: flex; align-items: center; gap: 8px; }
    .site-nav a {
      display: inline-flex;
      align-items: center;
      height: var(--control-height);
      padding: 0 16px;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;   /* a multi-word pill wraps to two lines and
                                breaks the header's single row */
      transition: color .15s ease, background-color .15s ease;
    }
    .site-nav a:hover { color: var(--fg); background: #f2f3f4; }
    .site-nav a.cta { color: #ffffff; background: var(--fg); padding: 0 24px; }
    .site-nav a.cta:hover { background: #000000; color: var(--accent); }

    /* --- hero --- */
    .hero { padding-block: 72px 0; }
    .hero h1 {
      max-width: 15ch;
      margin: 0 0 20px;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.03em;
    }
    .hero h1 .mark {
      background-image: linear-gradient(var(--accent), var(--accent));
      background-repeat: no-repeat;
      background-size: 100% 0.32em;
      background-position: 0 0.6em;
      padding-inline: 3px;
    }
    .hero .sub {
      max-width: 52ch;
      font-size: clamp(1.05rem, 1.6vw, 1.3rem);
      color: var(--muted);
      line-height: 1.5;
    }

    /* --- the form card ---
       A single card since "what we do" was removed: centred and width-capped
       so it does not stretch across the full 1200px canvas. */
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      justify-items: start;   /* left edge lines up with the headline above */
      padding-block: 56px 0;
    }
    .split .card { width: 100%; max-width: 640px; }
    .card {
      padding: 36px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .card h2 {
      margin: 0 0 16px;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    /* --- form --- */
    .field { margin: 0 0 16px; }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .field input,
    .field textarea {
      width: 100%;
      font: inherit;
      color: inherit;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .field input { height: var(--control-height); }
    .field textarea { min-height: 130px; resize: vertical; }
    .field input:focus,
    .field textarea:focus { outline: none; border-color: var(--fg); }
    .hp { position: absolute; left: -9999px; top: -9999px; }
    button.send {
      font: inherit;
      font-weight: 500;
      height: var(--control-height);
      padding: 0 28px;
      border-radius: 999px;
      border: 1px solid var(--fg);
      background: var(--fg);
      color: #ffffff;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease;
    }
    button.send:hover { background: #000000; color: var(--accent); }
    button.send:disabled { opacity: 0.5; cursor: wait; }
    #formstatus { margin: 14px 0 0; font-size: 0.9rem; color: var(--muted); }
    #formstatus.ok { color: #1a7f37; }
    #formstatus.bad, #formstatus.warn { color: #c0392b; }

    footer {
      margin: 96px 0 0;
      padding: 32px 0 56px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }
    footer a { text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 640px) {
      :root { --gutter: 18px; }
      .site-header .wrap { padding-block: 12px; }
      .site-nav a { padding: 0 12px; }
      .site-nav a.cta { padding: 0 18px; }
      .hero { padding-top: 48px; }
      .split { padding-top: 40px; }
      .card { padding: 26px 22px; }
    }
    @media (max-width: 560px) {
      .site-nav .nav-text { display: none; }
      .brand img { width: 180px; }
    }
    /* On the narrowest phones the 9:1 wordmark plus a no-wrap pill is wider
       than the row, so both give up a little rather than overflowing. */
    @media (max-width: 400px) {
      .brand img { width: 150px; }
      .site-nav a.cta { padding: 0 14px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="The Real Heroes of Ecommerce home">
      <img src="/logo.png" alt="The Real Heroes of Ecommerce" width="1000" height="225">
    </a>
    <nav class="site-nav">
      <a class="nav-text" href="/snapshot/">Snapshot CRO</a>
      <a class="nav-text" href="/newsletter/">Newsletter</a>
      <a class="cta" href="#start">Work with us</a>
    </nav>
  </div>
</header>

<main>

  <section class="hero wrap">
    <h1>Work with <span class="mark">us</span></h1>
    <p class="sub">Tell us what you are working on and what you need help with!</p>
  </section>

  <section class="split wrap" id="start">

    <div class="card">
      <h2>Get in touch</h2>
      <form id="leadform">
        <div class="field">
          <label for="f-name">Name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="f-email">Email</label>
          <input id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="f-brand">Brand / store</label>
          <input id="f-brand" name="brand" type="text" autocomplete="organization">
        </div>
        <div class="field">
          <label for="f-looking">What's up</label>
          <textarea id="f-looking" name="looking" placeholder="what you are selling, what is not working, what you have tried…"></textarea>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="f-company">Company</label>
          <input id="f-company" name="company" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button class="send" id="sendbtn" type="submit">Send it</button>
        <p id="formstatus" role="status" aria-live="polite"></p>
      </form>
    </div>

  </section>

</main>

<footer>
  <div class="wrap">
    <span>&copy; 2026 the real heroes of ecommerce</span>
    <span>
      <a href="/">home</a> &middot;
      <a href="/snapshot/">snapshot cro</a> &middot;
      <a href="/newsletter/">newsletter</a> &middot;
      <a href="mailto:shep@therealheroesofecommerce.com">email shep</a>
    </span>
  </div>
</footer>

<script>
(function () {
  // Google Apps Script web app URL (bound to the rhoe-cro-leads sheet).
  // The field names below must keep matching the sheet's columns.
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyLFgWFPjj3ml9LRYgYggpHXpb4NG8pCHk_Dertri-Q86tgFzbd_zdprpsK_7c3PJlJ/exec';

  var form = document.getElementById('leadform');
  var btn = document.getElementById('sendbtn');
  var status = document.getElementById('formstatus');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true;
    status.className = '';
    status.textContent = 'sending…';
    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      body: new URLSearchParams(new FormData(form))
    }).then(function () {
      status.className = 'ok';
      status.textContent = 'Got it. We\'ll be in touch — usually within a day.';
      form.reset();
      btn.disabled = false;
    }).catch(function () {
      status.className = 'bad';
      status.textContent = 'That didn\'t go through — email shep@therealheroesofecommerce.com instead.';
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
