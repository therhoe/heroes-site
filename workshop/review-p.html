<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Prognosis — Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>

  <h1 class="title">P // Prognosis</h1>
  <p class="tagline">// pique interest</p>

  <p>A product page is the crossroads of the customer journey. It is where they decide to buy from you, or decide to buy elsewhere.</p>

  <div class="review">
    <p class="q-prompt">Is the problem, pain-point, or promise reiterated on the page?</p>
    <div class="q" data-key="p_reiterated">
      <button type="button" class="opt" data-v="yes, it is">yes, it is</button>
      <button type="button" class="opt" data-v="no, it isn't" data-stop>no, it isn't</button>
    </div>
    <div class="q" data-key="p_text_visuals">
      <button type="button" class="opt" data-v="in text">in text</button>
      <button type="button" class="opt" data-v="with visuals">with visuals</button>
    </div>
    <div class="q" data-key="p_fold">
      <button type="button" class="opt" data-v="above the fold">above the fold</button>
      <button type="button" class="opt" data-v="below the fold">below the fold</button>
    </div>
    <div class="q" data-key="p_implicit">
      <button type="button" class="opt" data-v="implicit">implicit</button>
      <button type="button" class="opt" data-v="explicit">explicit</button>
    </div>
    <div class="q" data-key="p_rating">
      <button type="button" class="opt" data-v="done well">👍 done well</button>
      <button type="button" class="opt" data-v="needs improvement">👎 needs improvement</button>
      <button type="button" class="opt" data-v="neutral">🤷 neutral</button>
    </div>
  </div>

</main>
<script src="workshop.js"></script>
</body>
</html>
