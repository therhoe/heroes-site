<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Experimentation — Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>

  <h1 class="title">Experimentation</h1>
  <p class="tagline">// analytics for CRO</p>

  <form class="exercise" data-exercise="experimentation" data-endpoint="analytics" data-next="analytics-submitted.html">
    <div class="field">
      <label for="f-title">experiment title</label>
      <input id="f-title" name="title" type="text" required>
    </div>
    <div class="field">
      <label for="f-insight">data insight</label>
      <textarea id="f-insight" name="insight"></textarea>
    </div>
    <div class="field">
      <label for="f-hypothesis">hypothesis</label>
      <textarea id="f-hypothesis" name="hypothesis"></textarea>
    </div>
    <div class="field">
      <label for="f-design">test design</label>
      <textarea id="f-design" name="design"></textarea>
    </div>
    <div class="field">
      <label for="f-audience">target audience (if different from ALL)</label>
      <input id="f-audience" name="audience" type="text">
    </div>
    <div class="field">
      <label for="f-goal">goal or expectation</label>
      <textarea id="f-goal" name="goal"></textarea>
    </div>
    <button class="send" type="submit">→ send it</button>
    <p class="status muted"></p>
  </form>

</main>
<script src="workshop.js"></script>
</body>
</html>
