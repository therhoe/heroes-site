<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Your answers — Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main data-review-store="workshop_review_funnels">

  <h1 class="title">Your answers</h1>
  <p class="tagline">// the backlog</p>

  <p class="lede">What is the problem, and where might we need to optimize to fix it?</p>

  <div class="worksheet">
    <div class="worksheet-main">
    <p class="recap-q">// funnel one</p>
    <p class="recap" data-show="funnel_1"></p>

    <p class="recap-q">// funnel two</p>
    <p class="recap" data-show="funnel_2"></p>

    <p class="recap-q">// funnel three</p>
    <p class="recap" data-show="funnel_3"></p>
    </div>

    <aside class="panel worksheet-panel">
      <p class="panel-title">// share them with us</p>
      <p class="note">Send these over and we'll go through them together.</p>
      <form class="exercise" data-review data-exercise="funnel-review" data-endpoint="backlog">
        <button class="send" type="submit">&rarr; send my answers</button>
        <p class="status muted"></p>
      </form>
    </aside>
  </div>

</main>

<script src="workshop.js"></script>
</body>
</html>
