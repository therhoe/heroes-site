<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Analytics for CRO — Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    table.defs {
      max-width: 720px;
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 20px;
      line-height: 1.6;
    }
    table.defs td {
      padding: 20px 28px 20px 0;
      border-bottom: 1px solid #e2e2e2;
      vertical-align: top;
    }
    table.defs tr:last-child td { border-bottom: none; }
    table.defs td:first-child { font-weight: 600; white-space: nowrap; }
    table.defs td:last-child { color: #666; padding-right: 0; }
    @media (max-width: 640px) {
      table.defs td:first-child { white-space: normal; }
    }
  </style>
</head>
<body>
<main>

  <div class="slide-center" style="min-height: 72vh;">
    <table class="defs">
      <tr>
        <td>Reports</td>
        <td>Shopify Analytics, GA4</td>
      </tr>
      <tr>
        <td>Quantitative Data (analytics)</td>
        <td>Clarity, GA4, Triple Whale, Snapshot</td>
      </tr>
      <tr>
        <td>Qualitative Data (feedback, interviews)</td>
        <td>Zigpoll, Lucky Orange, Cohort</td>
      </tr>
    </table>
  </div>

</main>
<script src="workshop.js"></script>
</body>
</html>
