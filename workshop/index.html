  <title>Workshop — The Real Heroes of Ecommerce</title>

<body data-gate>
<main>

  <h1 class="title">Workshop</h1>
  <p class="tagline">// the real heroes of ecommerce</p>

  <p>this workshop is invite-only. enter the email your invite was sent to.</p>

  <form class="exercise" id="gateform">

    <button class="send" type="submit">enter →</button>
    <p class="status muted" id="gatestatus"></p>
  </form>

</main>
<script src="workshop.js"></script>
