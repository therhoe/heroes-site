url: "https://therealheroesofecommerce.com"
title: The Real Heroes of Ecommerce
description: CRO, Shopify, and building in public.

collections:
  newsletter:
    output: true
    permalink: /newsletter/:name/

defaults:
  - scope:
      path: ""
      type: newsletter
    values:
      layout: newsletter

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

feed:
  collections:
    - newsletter

exclude:
  - .claude
  - README.md
  - CLAUDE.md
  - substack export
  - substacks
  - posts.csv
